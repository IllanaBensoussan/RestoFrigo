name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # The keystore comes from the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets.
      # Without them the APK is built unsigned and has to be signed by hand (see README).
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/restofrigo.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/restofrigo.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          case "$apk" in *unsigned*) out=restofrigo-unsigned.apk ;; *) out=restofrigo.apk ;; esac
          cp "$apk" "$out"
          echo "APK=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: restofrigo-apk
          path: ${{ env.APK }}
      - name: Publish as the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "RestoFrigo Android" --notes "Dernier APK Android de RestoFrigo (Android 16 et plus)." --prerelease --target "$GITHUB_SHA"
          gh release upload android "$APK" --clobber
          # Once the APK is signed, the unsigned one from before the secrets existed is only confusing.
          if [ "$APK" = restofrigo.apk ]; then gh release delete-asset android restofrigo-unsigned.apk --yes || true; fi
